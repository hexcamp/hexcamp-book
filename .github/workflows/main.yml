name: Build and Deploy to IPFS Cluster

permissions:
  contents: read
  pull-requests: write
  statuses: write
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-deploy-ipfs-cluster:
    runs-on: ubuntu-latest
    outputs: # This exposes the CID output of the action to the rest of the workflow
      cid: ${{ steps.deploy.outputs.cid }}
    steps:
      - name: Fix MTU Network Issue
        run: sudo ifconfig eth0 mtu 1400

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2

      - run: mdbook build --dest-dir ./book/6kg6ryaaaaaa-hexcamp-book

      - name: List dirs
        run: ls -l book/*

